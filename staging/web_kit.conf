# web_kit - configng-v2 metadata

[web_kit]
# Main feature provided by this module (usually the same as the module name).
feature=web_kit

# Short, single-line summary describing what this module does.
description=Generate and serve web assets: icons, logos JSON, contributors JSON and HTML pages; includes a simple test HTTP server.

# Longer description with more details about the module's features or usage.
extend_desc=Provides a collection of utilities to build site assets from SVG sources (create PNG icon sets at multiple sizes, favicons), aggregate SVG/PNG metadata into a combined logos JSON, generate contributors JSON from GitHub repos (requires jq & wget), render contributors and images HTML pages, and run a local Python3 HTTP server for testing. Configurable via environment variables (WEB_ROOT, WEB_JSON_ROOT, SVG_LOGO_ROOT, WEB_LOGO_ROOT, ICON_SIZES, WEB_PORT). Requires Bash, Python 3 and ImageMagick (magick/convert); contributors JSON generation requires jq and wget.

# Comma-separated list of commands supported by this module (e.g., help,status,reload).
options=help,server,icons,json,contrib,pages,build

# Main category this module belongs to. Must be one of: network, system, software, locales.
parent=development

# Group or tag for this module. See docs/readme.md (group index) for options.
# If none fit, suggest a new group in your pull request.
group=workflow

# Contributor's GitHub username (use @username).
contributor=@Tearran

# Comma-separated list of supported CPU architectures.
arch=all

# Comma-separated list of supported operating systems.
require_os=linux,macos

# What kernel are you using? (minimum required version, e.g., 5.15+)
require_kernel=not-applicable

# Comma-separated list of network ports used by this module (e.g., 8080,8443). Use 'false' if not applicable.
port=false

# Comma-separated list of functions in this module (all functions except the main feature).
# NOTE: You must include the help message function _about_web_kit; validation will fail if it is missing.
helpers=_about_web_kit,_web_kit_logo_json,_web_kit_images_page,_web_kit_server_py,_web_kit_contributors_json,_web_kit_contrib_page,_web_kit_icon_set,json_escape,extract_tag_content

# List each command and its description below.
# Example:
# show=Display the current configuration
[options]
help=Show help for this module
server=Run a Python 3 simple web server for the specified path (default: WEB_ROOT), binds to 127.0.0.1, stops on keypress
icons=Generate icon sets and favicon from SVG sources; renders PNGs at sizes from ICON_SIZES (uses ImageMagick)
json=Generate combined logos JSON from SVG and PNG assets (writes json/images/logo.json)
contrib=Generate contributors JSON for a GitHub repo using jq and wget (writes json/contributors/<repo>.json)
pages=Generate contributors and images HTML pages (contributors.html, images.html) into the web root
build=Build icons, logos JSON, contributors JSON and pages (and run test server as final step)

