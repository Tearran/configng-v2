<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Images — json/images/logo.json</title>
  <style>
    :root {
      --bg: #0f1113;
      --card: #131417;
      --muted: #9ea3a8;
      --accent: #2ea44f;
      --gap: 12px;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: #eef;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial
    }

    header,
    footer {
      padding: 12px;
      background: transparent;
      color: var(--muted)
    }

    main {
      padding: 18px;
      max-width: 1200px;
      margin: 0 auto
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 12px
    }

    .controls .input,
    .controls select,
    .controls button {
      background: #121216;
      border: 1px solid #222;
      color: #eef;
      padding: 8px;
      border-radius: 6px
    }

    .meta-row {
      display: flex;
      gap: 8px;
      align-items: center
    }

    .summary {
      color: var(--muted);
      font-size: 0.95rem
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: var(--gap);
      align-items: start
    }

    .card {
      background: var(--card);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 170px;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.02) inset
    }

    .thumb {
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .thumb img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain
    }

    .title {
      font-weight: 600;
      color: #fff;
      word-break: break-word
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.92rem
    }

    .desc {
      color: #bfc6c9;
      font-size: 0.88rem;
      margin-top: 6px
    }

    .badge {
      background: #222;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.78rem;
      color: #ddd;
      display: inline-block
    }

    .empty {
      padding: 36px;
      text-align: center;
      color: var(--muted)
    }

    footer small {
      color: var(--muted)
    }

    /* responsive tweaks */
    @media (max-width:460px) {
      .controls {
        flex-direction: column;
        align-items: stretch
      }

      .meta-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px
      }
    }
  </style>
</head>

<body>
  <!-- header placeholder (kept minimal intentionally, main is the focus) -->
  <header role="banner">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div><strong>Images</strong> <span style="color:var(--muted)">— data: json/images/logo.json</span></div>
      <div class="summary" id="count">Loading…</div>
    </div>
  </header>

  <!-- main: primary focus of the page -->
  <main role="main">
    <div class="controls" aria-controls="grid">
      <div class="meta-row" style="flex:1">
        <label>
          Category
          <select id="categoryFilter" class="input" aria-label="Filter by category">
            <option value="">All</option>
          </select>
        </label>

        <label>
          Search
          <input id="search" class="input" type="search" placeholder="name, title or description"
            aria-label="Search images">
        </label>
      </div>

      <div style="display:flex;gap:8px;align-items:center">
        <button id="refresh" title="Reload data">Refresh</button>
        <button id="download" title="Download JSON">Download JSON</button>
      </div>
    </div>

    <!-- content grid -->
    <section id="grid" class="grid" aria-live="polite"></section>
    <div id="empty" class="empty" style="display:none">No images found.</div>
  </main>

  <!-- footer placeholder (kept minimal intentionally) -->
  <footer role="contentinfo">
    <small>Ensure the combined JSON exists at <code>public_html/json/images/logo.json</code>.</small>
  </footer>

  <script>
    (async () => {
      const JSON_URL = 'json/images/logo.json';
      const grid = document.getElementById('grid');
      const empty = document.getElementById('empty');
      const countEl = document.getElementById('count');
      const categorySelect = document.getElementById('categoryFilter');
      const searchInput = document.getElementById('search');
      const refreshBtn = document.getElementById('refresh');
      const downloadBtn = document.getElementById('download');

      function normalize(s) { return (s || '').toString().toLowerCase(); }

      async function fetchJson() {
        try {
          const res = await fetch(JSON_URL + '?_=' + Date.now(), { cache: 'no-cache' });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          if (!Array.isArray(data)) throw new Error('JSON root is not an array');
          return data;
        } catch (err) {
          console.error('Failed to load', JSON_URL, err);
          return { error: err };
        }
      }

      function populateCategories(items) {
        const cats = Array.from(new Set(items.map(i => i.category || 'other'))).sort();
        while (categorySelect.options.length > 1) categorySelect.remove(1);
        for (const c of cats) {
          const o = document.createElement('option'); o.value = c; o.textContent = c; categorySelect.appendChild(o);
        }
      }

      function render(items) {
        grid.innerHTML = '';
        if (!items || items.length === 0) {
          empty.textContent = 'No images found.';
          empty.style.display = 'block';
          countEl.textContent = '0';
          return;
        }
        empty.style.display = 'none';
        countEl.textContent = items.length + ' items';
        for (const it of items) {
          const card = document.createElement('article'); card.className = 'card'; card.setAttribute('aria-label', it.name || 'image');
          // thumbnail
          const t = document.createElement('div'); t.className = 'thumb';
          const img = document.createElement('img');
          let src = '';
          if (Array.isArray(it.pngs) && it.pngs.length && it.pngs[0].path) src = it.pngs[0].path;
          else if (it.svg) src = it.svg;
          img.src = src || '';
          img.alt = it.name || '';
          t.appendChild(img);
          // meta
          const meta = document.createElement('div'); meta.className = 'meta';
          const title = document.createElement('div'); title.className = 'title'; title.textContent = it.name || '';
          const subtitle = document.createElement('div'); subtitle.className = 'subtitle'; subtitle.textContent = (it.svg_meta && it.svg_meta.title) ? it.svg_meta.title : '';
          const desc = document.createElement('div'); desc.className = 'desc'; desc.textContent = (it.svg_meta && it.svg_meta.desc) ? it.svg_meta.desc : '';
          const badge = document.createElement('div'); badge.className = 'badge'; badge.textContent = it.category || '';
          meta.appendChild(title); meta.appendChild(subtitle); meta.appendChild(desc); meta.appendChild(badge);

          card.appendChild(t);
          card.appendChild(meta);
          grid.appendChild(card);
        }
      }

      function applyFilters() {
        const q = normalize(searchInput.value);
        const cat = categorySelect.value;
        const items = window._IMAGES_CACHE || [];
        const filtered = items.filter(it => {
          if (cat && (it.category || '') !== cat) return false;
          if (!q) return true;
          return normalize(it.name).includes(q) ||
            normalize((it.svg_meta && it.svg_meta.title) || '').includes(q) ||
            normalize((it.svg_meta && it.svg_meta.desc) || '').includes(q);
        });
        render(filtered);
      }

      refreshBtn.addEventListener('click', async () => {
        await loadAndRender();
      });
      downloadBtn.addEventListener('click', async () => {
        try {
          const res = await fetch(JSON_URL);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'logo.json';
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
        } catch (e) { alert('Download failed: ' + e.message); }
      });

      searchInput.addEventListener('input', applyFilters);
      categorySelect.addEventListener('change', applyFilters);

      async function loadAndRender() {
        grid.innerHTML = '';
        empty.style.display = 'none';
        countEl.textContent = 'Loading…';
        const result = await fetchJson();
        if (result && result.error) {
          empty.textContent = 'Failed to load JSON: ' + result.error.message;
          empty.style.display = 'block';
          countEl.textContent = '0';
          window._IMAGES_CACHE = [];
          return;
        }
        window._IMAGES_CACHE = result;
        populateCategories(result);
        render(result);
      }

      // initial
      await loadAndRender();
    })();
  </script>
</body>

</html>
