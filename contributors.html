<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contributors</title>
  <style>
    body {
      font-family: sans-serif;
      background: #222;
      color: #eee;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 15px;
      padding: 20px;
    }
    .contributor {
      text-align: center;
      background: #333;
      padding: 10px;
      border-radius: 10px;
      transition: transform 0.2s;
    }
    .contributor:hover {
      transform: scale(1.05);
    }
    .contributor img {
      border-radius: 50%;
      width: 80px;
      height: 80px;
    }
    .contributor p {
      margin: 10px 0 0;
      font-size: 14px;
      color: #bbb;
    }
  </style>
</head>
<body>
  <h1>Contributors</h1>
  <div class="grid" id="contributors"></div>

  <script>
    fetch('contributors.json')
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById('contributors');
        data.forEach(user => {
          const div = document.createElement('div');
          div.className = 'contributor';
          div.innerHTML = `
            <a href="https://github.com/${user.login}" target="_blank">
              <img src="${user.avatar_url}" alt="${user.login}">
              <p>${user.login}</p>
            </a>
          `;
          container.appendChild(div);
        });
      });
  </script>
</body>
</html>
